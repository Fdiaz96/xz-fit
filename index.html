<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F11">
  <script>try { var t = localStorage.getItem('tf-theme'); if (t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="XZ Fit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Tu rutina de fuerza con mancuernas, guiada serie por serie: peso sugerido, progresión y descarga. Se adapta si algo te duele.">
  <title>XZ Fit</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/Oswald.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-train" hidden></section>
    <section class="view" id="view-tendons" hidden></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </div>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
      <span>Hoy</span>
    </button>
    <button data-tab="train">
      <svg viewBox="0 0 24 24"><path d="M2 10h2V7h3v4h10V7h3v3h2v4h-2v3h-3v-4H7v4H4v-3H2z"/></svg>
      <span>Entreno</span>
    </button>
    <button data-tab="tendons">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0112 6.3 5.3 5.3 0 0121.3 12C19 16.6 12 21 12 21z"/></svg>
      <span>Dolor</span>
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M3 20V4h2v14h16v2zm4-4l4-5 3 3 5-7 1.6 1.2-6.4 9-3-3-2.6 3.3z"/></svg>
      <span>Historial</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 00-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 000 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.8zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <dialog id="onb" class="full"></dialog>
  <dialog id="wsheet" class="full"></dialog>
  <dialog id="rsheet" class="full pain"></dialog>
  <dialog id="painsheet" class="sheet"></dialog>
  <dialog id="exsheet" class="sheet"></dialog>
  <dialog id="customsheet" class="sheet"></dialog>
  <dialog id="pickersheet" class="sheet"></dialog>
  <dialog id="swapsheet" class="sheet"></dialog>
  <dialog id="exformsheet" class="sheet"></dialog>
  <dialog id="machsheet" class="sheet"></dialog>
  <dialog id="newssheet" class="sheet"></dialog>
  <dialog id="sumsheet" class="sheet"></dialog>

  <div id="rest" role="timer" aria-live="off" hidden><span id="rest-label">Descanso</span><strong id="rest-time">1:30</strong><button type="button" data-action="skip-rest">Saltar</button></div>
  <div id="toast" role="status" aria-live="polite" hidden><span></span></div>
  <div id="tip" hidden></div>

  <script src="data.js"></script>
  <script src="logic.js"></script>
  <script src="figures.js"></script>
  <script src="app.js"></script>
</body>
</html>
